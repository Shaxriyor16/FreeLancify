<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Freelancify</title>
    <link href="/src/index.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-gray-50 dark:bg-slate-900 min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="w-full max-w-md bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-gray-100 dark:border-slate-700 overflow-hidden relative"
    >
      <div class="p-8">
        <div class="flex items-center gap-2 mb-8 justify-center">
          <div
            class="w-8 h-8 bg-primary rounded-xl flex items-center justify-center"
          >
            <svg
              class="w-5 h-5 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 10V3L4 14h7v7l9-11h-7z"
              ></path>
            </svg>
          </div>
          <span
            class="font-display font-bold text-xl text-gray-900 dark:text-white tracking-tight"
            >Freelancify</span
          >
        </div>

        <h1
          class="text-2xl font-display font-bold text-gray-900 dark:text-white mb-2 text-center"
          id="login-title"
        >
          Welcome back
        </h1>
        <p
          class="text-sm text-gray-500 dark:text-gray-400 text-center mb-8"
          id="login-desc"
        >
          Enter your credentials to access your account.
        </p>

        <form id="login-form" class="space-y-5">
          <div id="step-1">
            <div class="mb-5">
              <label
                class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5"
                >Email Address</label
              >
              <input
                type="email"
                id="email"
                required
                class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-gray-400 dark:placeholder:text-gray-500"
                placeholder="name@example.com"
              />
            </div>
            <div>
              <div class="flex justify-between items-center mb-1.5">
                <label
                  class="block text-sm font-bold text-gray-700 dark:text-gray-300"
                  >Password</label
                >
                <a
                  href="#"
                  class="text-xs font-semibold text-primary hover:text-primary-600 transition-colors"
                  >Forgot password?</a
                >
              </div>
              <input
                type="password"
                id="password"
                required
                class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-gray-400 dark:placeholder:text-gray-500"
                placeholder="••••••••"
              />
            </div>
          </div>

          <div id="step-2" class="hidden">
            <div class="mb-5">
              <label
                class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5 text-center"
                >Enter 6-digit code</label
              >
              <div class="flex justify-center gap-2" id="otp-inputs">
                <input
                  type="text"
                  maxlength="1"
                  class="w-12 h-14 text-center text-xl font-bold bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary outline-none transition-all dark:text-white"
                />
                <input
                  type="text"
                  maxlength="1"
                  class="w-12 h-14 text-center text-xl font-bold bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary outline-none transition-all dark:text-white"
                />
                <input
                  type="text"
                  maxlength="1"
                  class="w-12 h-14 text-center text-xl font-bold bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary outline-none transition-all dark:text-white"
                />
                <input
                  type="text"
                  maxlength="1"
                  class="w-12 h-14 text-center text-xl font-bold bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary outline-none transition-all dark:text-white"
                />
                <input
                  type="text"
                  maxlength="1"
                  class="w-12 h-14 text-center text-xl font-bold bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary outline-none transition-all dark:text-white"
                />
                <input
                  type="text"
                  maxlength="1"
                  class="w-12 h-14 text-center text-xl font-bold bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary outline-none transition-all dark:text-white"
                />
              </div>
            </div>
          </div>

          <button
            type="submit"
            id="login-btn"
            class="w-full bg-primary text-white font-bold py-3.5 px-4 rounded-xl hover:bg-primary-600 transition-colors shadow-sm mt-2 flex items-center justify-center gap-2 group"
          >
            Sign In
            <svg
              class="w-4 h-4 group-hover:translate-x-1 transition-transform"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M14 5l7 7m0 0l-7 7m7-7H3"
              ></path>
            </svg>
          </button>
        </form>

        <div
          class="mt-8 pt-6 border-t border-gray-100 dark:border-slate-700/50 text-center"
        >
          <p class="text-sm text-gray-600 dark:text-gray-400">
            Don't have an account?
            <a
              href="/register.html"
              class="font-bold text-primary hover:text-primary-600 transition-colors"
              >Register here</a
            >
          </p>
        </div>
      </div>
    </div>

    <script>
      let currentStep = 1;
      const form = document.getElementById("login-form");
      const step1 = document.getElementById("step-1");
      const step2 = document.getElementById("step-2");
      const loginTitle = document.getElementById("login-title");
      const loginDesc = document.getElementById("login-desc");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginBtn = document.getElementById("login-btn");

      const otpInputs = document.querySelectorAll("#otp-inputs input");

      // Auto-focus and move between OTP inputs
      otpInputs.forEach((input, index) => {
        input.addEventListener("input", (e) => {
          if (e.target.value.length === 1) {
            if (index < otpInputs.length - 1) otpInputs[index + 1].focus();
          }
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !e.target.value && index > 0) {
            otpInputs[index - 1].focus();
          }
        });
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        if (currentStep === 1) {
          // Validate
          if (!emailInput.value || !passwordInput.value) return;

          // Simulate API check
          loginBtn.innerHTML = `
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Verifying credentials...
          `;
          loginBtn.disabled = true;

          setTimeout(() => {
            currentStep = 2;
            step1.classList.add("hidden");
            step2.classList.remove("hidden");
            loginTitle.textContent = "Check your email";
            loginDesc.textContent = `We've sent a 6-digit code to ${emailInput.value}.`;
            loginBtn.innerHTML = `Verify Code`;
            loginBtn.disabled = false;
            if (otpInputs[0]) otpInputs[0].focus();
          }, 1500);
        } else if (currentStep === 2) {
          let code = Array.from(otpInputs)
            .map((i) => i.value)
            .join("");
          if (code.length < 6) return;

          loginBtn.innerHTML = `
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Authenticating...
          `;
          loginBtn.disabled = true;

          setTimeout(() => {
            window.location.href = "/index.html";
          }, 1500);
        }
      });
    </script>
  </body>
</html>
